# Yasmina portal catalogue (P6.3).
#
# The worker reads this file, selects the engine and scrapes every target with
# enabled: true. Entries marked verified:false are discovery targets whose
# start_url and engine must be validated against the live portal before they
# are enabled. Only verified portals are enabled by default so a scheduled run
# never hammers an unverified endpoint.
