[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yasmina"
version = "0.1.0"
description = "AI-orchestrated B2B sourcing, pricing and tender-bidding engine for German cleaning & hygiene supplies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Yasmina" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "minio>=7.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
parsing = [
    "docling>=2.0",
    "pygaeb",
]
ai = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
]
e-invoicing = [
    "factur-x>=3.0",
    "lxml>=5.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/HamdyFouad/Yasmina"

[project.scripts]
yasmina-preflight = "src.preflight:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "alembic", "alembic.ini", "tests", "docs", "AGENTS.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = "(^alembic/versions/|^tests/)"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
