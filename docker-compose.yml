# Project Yasmina — isolated infrastructure services.
#
# ERPNext is intentionally NOT part of this stack: it is deployed as a separate
# isolated system and reached only through its REST API (see AGENTS.md).
#
# Start core services:      docker compose up -d postgres minio clamav
# Start with automation:    docker compose --profile automation up -d
#
# The application itself runs on the host (uvicorn), not in this compose file.

name: yasmina

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yasmina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yasmina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yasmina}
      POSTGRES_DB: ${POSTGRES_DB:-yasmina}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - yasmina

  minio:
    # Upstream MinIO registries stopped serving anonymous pulls; pgsty mirrors
    # the official release binaries. Release tags are pinned for reproducibility.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: yasmina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yasmina-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yasmina-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - yasmina

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    container_name: yasmina-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yasmina-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yasmina-minio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-yasmina}
    restart: "no"
    networks:
      - yasmina

  clamav:
    image: clamav/clamav:1.5.4-debian
    container_name: yasmina-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - yasmina

  n8n:
    image: n8nio/n8n:2.47.2
    container_name: yasmina-n8n
    profiles: ["automation"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-yasmina}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-yasmina}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}/
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - yasmina

networks:
  yasmina:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  n8n_data:
