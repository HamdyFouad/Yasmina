name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
  API_ADMIN_PASSWORD: ci-admin-password
  POSTGRES_USER: yasmina
  POSTGRES_PASSWORD: yasmina
  POSTGRES_DB: yasmina
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  DATABASE_URL: postgresql+asyncpg://yasmina:yasmina@localhost:5432/yasmina
  YASMINA_TEST_DATABASE_URL: postgresql+asyncpg://yasmina:yasmina@localhost:5432/yasmina
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: yasmina-ci
  MINIO_SECRET_KEY: yasmina-ci-secret
  MINIO_BUCKET: yasmina
  MINIO_SECURE: "false"
  CLAMAV_HOST: localhost
  CLAMAV_PORT: "3310"
  YASMINA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
  YASMINA_TEST_SERVICES: "1"
  ED25519_APPROVAL_PUBLIC_KEY: abababababababababababababababababababababababababababababababab

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e-invoicing]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy strict
        run: python -m mypy src

      - name: Generate PDF/A-3 carrier sample
        run: python scripts/generate_sample_invoice.py sample-invoice.pdf

      - name: veraPDF PDF/A-3 conformance
        run: |
          docker run --rm -v "$PWD:/data" verapdf/cli:latest -f 3b /data/sample-invoice.pdf > verapdf-report.xml || true
          grep -q 'isCompliant="true"' verapdf-report.xml
          grep -q 'PDF/A-3b' verapdf-report.xml
          echo "PDF/A-3b conformance verified."

      - name: Compile sources
        run: python -m compileall -q src alembic tests

      - name: Render and verify migration SQL
        run: |
          python -m alembic upgrade head --sql > migration.sql
          grep -q "CREATE EXTENSION IF NOT EXISTS vector" migration.sql
          grep -q "USING hnsw (embedding vector_cosine_ops)" migration.sql
          grep -q "CREATE TRIGGER trg_audit_logs_append_only" migration.sql
          grep -q "CREATE TRIGGER trg_audit_logs_no_truncate" migration.sql
          grep -q "CREATE TABLE invoice_events" migration.sql
          grep -q "CREATE TABLE credit_notes" migration.sql
          grep -q "CREATE TRIGGER trg_invoice_events_append_only" migration.sql
          grep -q "CREATE TRIGGER trg_invoice_events_no_truncate" migration.sql
          grep -q "CREATE TABLE password_reset_tokens" migration.sql
          grep -q "ALTER TABLE users ADD COLUMN mfa_enabled" migration.sql
          grep -q "INSERT INTO alembic_version" migration.sql

      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env must never be committed."
            exit 1
          fi
          echo ".env is not tracked."

      - name: Validate compose stacks
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.yml config -q
          docker compose --env-file .env.prod -f docker-compose.prod.yml config -q
          rm -f .env.prod
          echo "Compose stacks are valid."

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yasmina
          POSTGRES_PASSWORD: yasmina
          POSTGRES_DB: yasmina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yasmina -d yasmina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Start MinIO
        # GitHub service containers cannot pass a command; MinIO requires
        # `server /data`, so start the container explicitly. Upstream stopped
        # serving anonymous Docker Hub pulls, so the pinned pgsty mirror
        # (same as docker-compose.yml) is used instead.
        run: |
          docker run -d --name yasmina-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become healthy" >&2
          exit 1

      - name: Wait for ClamAV
        run: |
          for i in $(seq 1 90); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/3310'; then
              exit 0
            fi
            sleep 5
          done
          echo "ClamAV did not become healthy" >&2
          exit 1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e-invoicing]"

      - name: Create MinIO bucket
        run: |
          python -c "from minio import Minio; c=Minio('localhost:9000', access_key='$MINIO_ACCESS_KEY', secret_key='$MINIO_SECRET_KEY', secure=False); c.make_bucket('$MINIO_BUCKET') if not c.bucket_exists('$MINIO_BUCKET') else None"

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Preflight against real services
        run: python -m src.preflight --skip n8n

      - name: Full test suite (live database included)
        # Keep the pytest output on the runner, but also surface failures as
        # check-run annotations so a red build is diagnosable without access to
        # the full job log.
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.log 2>&1
          status=$?
          tail -n 40 pytest.log
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^(FAILED|ERROR) ' pytest.log | head -n 25 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Pytest failures::${failures:-pytest exited non-zero}"
            log_tail=$(tail -n 25 pytest.log | awk '{printf "%s%%0A", $0}')
            echo "::error title=Pytest log tail::${log_tail}"
          fi
          exit "$status"

      - name: Compile sources
        run: python -m compileall -q src alembic tests

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image (slim extras)
        # The full default image also bundles Docling/pygaeb; CI builds the
        # invoice + LLM variant to keep the gate fast while exercising the same
        # Dockerfile stages, non-root user and bytecode compilation.
        run: docker build --build-arg INSTALL_EXTRAS="ai,e-invoicing" -t yasmina-api:ci .

      - name: Verify runtime contract
        run: |
          uid=$(docker run --rm yasmina-api:ci id -u)
          test "$uid" = "10001"
          echo "non-root uid: $uid"
          docker run --rm yasmina-api:ci python -c "import src.main; print('app imports cleanly')"
          pyc=$(docker run --rm yasmina-api:ci sh -c 'find /app/src -name "*.pyc" | wc -l')
          test "$pyc" -gt 40
          echo "precompiled modules: $pyc"
          docker run --rm yasmina-api:ci python -m src.admin generate-backup-key \
            | grep -Eq '^[A-Za-z0-9_-]{43}=$'
          echo "backup key generation works in the runtime image."

  frontend:
    name: Frontend (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit[toml]>=1.7"

      - name: Bandit (medium/high severity gate)
        run: python -m bandit -r src -c pyproject.toml -ll

      - name: Build image for scanning
        run: docker build --build-arg INSTALL_EXTRAS="ai,e-invoicing" -t yasmina-api:security .

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yasmina-api:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
