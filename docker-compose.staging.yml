# Project Yasmina — staging stack.
#
# Images are built and pushed by .github/workflows/deploy-staging.yml, then this
# file is copied to the VPS deploy directory. The deploy script exports
# REGISTRY, IMAGE_OWNER and IMAGE_TAG for the duration of the rollout and writes
# the successful IMAGE_TAG back to .env.staging for host restarts.

name: yasmina-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.staging
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # No init-script bind mount: the VPS receives only the compose file and the
      # deployment scripts, and Alembic creates pgvector idempotently. n8n is not
      # part of the staging stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - backend

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env.staging
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - backend

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env.staging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc mb --ignore-existing "local/$$BACKUP_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$BACKUP_BUCKET"
    restart: "no"
    logging: *default-logging
    networks:
      - backend

  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --save "900 1"
        --requirepass "$$REDIS_PASSWORD"
    env_file: .env.staging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - backend

  api:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-hamdyfouad}/yasmina-api:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.staging
    environment:
      APP_ENV: staging
      LOG_FORMAT: json
      METRICS_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      TRUST_PROXY_HEADERS: "true"
      GAEB_EXPORT_DIR: /tmp/exports/gaeb
      PORTAL_CONFIG_FILE: /app/config/portals.yaml
    command:
      - /bin/sh
      - -c
      - |
        set -e
        python -m alembic upgrade head
        exec python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --no-access-log
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging: *default-logging
    # `backend` is internal, so application containers also join `edge` for
    # outbound traffic (DeepSeek, ERPNext, ACME); databases stay isolated.
    networks:
      backend:
        aliases:
          - yasmina-api
      edge: {}

  worker:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-hamdyfouad}/yasmina-worker:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.staging
    environment:
      APP_ENV: staging
      LOG_FORMAT: json
      PORTAL_CONFIG_FILE: /app/config/portals.yaml
      SCRAPER_PREFER_API: "true"
    command:
      - /bin/sh
      - -c
      - exec python -m src.worker schedule --portal all
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /app/var/ingestion:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend
      - edge

  sync-worker:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-hamdyfouad}/yasmina-sync-worker:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env.staging
    environment:
      APP_ENV: staging
      LOG_FORMAT: json
    command:
      - /bin/sh
      - -c
      - exec python -m src.worker process --interval 30
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /app/var/ingestion:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend
      - edge

  caddy:
    image: "${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-hamdyfouad}/yasmina-edge:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
